name: Setup Build Environment
runs:
  using: "composite"
  steps:

    - name: Init Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
          ~/.platformio/packages
          ~/.platformio/platforms
          .pio/libdeps
        key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'variants/**/platformio.ini', '**/library.json', '**/library.properties') }}
        restore-keys: |
          ${{ runner.os }}-pio-

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install "platformio>=6.1,<7"

    # A HiveFW tag such as "v1.12.0" is exposed as GIT_TAG_VERSION.
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # Triggered by a HiveFW version tag.
          GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_STRING="${GIT_TAG_NAME##*-}"
        else
          # triggered by a workflow dispatch (e.g: refs/heads/main)
          # use VERSION as the single source of truth for branch builds
          if [ -f VERSION ]; then
            VERSION_STRING=$(tr -d '[:space:]' < VERSION)
          else
            # fallback for branches without a VERSION file
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            VERSION_STRING=$(echo "$BRANCH_NAME" | tr '/' '-')
          fi
        fi
        echo "GIT_TAG_VERSION=${VERSION_STRING}" >> $GITHUB_ENV
