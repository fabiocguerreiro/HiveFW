name: HiveFW App test suite

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app-test.yml"
  workflow_dispatch:

concurrency:
  group: hivefw-app-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
