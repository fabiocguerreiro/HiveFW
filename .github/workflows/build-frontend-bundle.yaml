name: Build frontend bundle

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "VERSION"
      - ".github/workflows/build-frontend-bundle.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hivefw-frontend-bundle-main
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'fabiocguerreiro/HiveFW'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundle
        run: npm run build

      - name: Commit generated bundle
        working-directory: .
        run: |
          if git diff --quiet -- \
            custom_components/hivefw_integration/hivefw-integration-panel.js \
            custom_components/hivefw_integration/hivefw-panel.js; then
            echo "Bundles already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/hivefw_integration/hivefw-integration-panel.js \
            custom_components/hivefw_integration/hivefw-panel.js
          git commit -m "Build frontend bundle [skip ci]"
          git pull --rebase origin main
          git push
