name: Build & Release HiveFW
# Fast release pipeline: build supported targets in parallel, then publish once.

concurrency:
  group: hivefw-release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - ".github/workflows/hivefw-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Heltec_v3_companion_radio_wifi
          - Heltec_v3_companion_radio_ble
          - Heltec_t114_companion_radio_ble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment

      - name: Resolve firmware version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${VERSION#V}"
          VERSION="${VERSION#v}"

          MANIFEST_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("custom_components/hivefw_integration/manifest.json").read_text())
          print(data["version"])
          PY
          )"

          if [[ "${VERSION}" != "${MANIFEST_VERSION}" ]]; then
            echo "Version mismatch: VERSION=${VERSION}, manifest=${MANIFEST_VERSION}"
            exit 1
          fi

          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.target }}
        env:
          FIRMWARE_VERSION: V${{ steps.version.outputs.version }}
        shell: bash
        run: ./build.sh build-firmware "${{ matrix.target }}"

      - name: Prepare target release assets
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          case "$TARGET" in
            Heltec_v3_companion_radio_wifi)
              V3_BIN="$(find out -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*.bin' ! -name '*-merged.bin' -print -quit)"
              V3_MERGED="$(find out -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*-merged.bin' -print -quit)"
              test -s "$V3_BIN"
              test -s "$V3_MERGED"
              cp "$V3_BIN" "$V3_MERGED" release-assets/

              V3_BUILD_DIR=".pio/build/Heltec_v3_companion_radio_wifi"
              BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
              RECOVERY_DIR="recovery-v3"
              RECOVERY_ZIP="release-assets/$(basename "$V3_BIN" .bin)-recovery.zip"

              test -s "$V3_BUILD_DIR/bootloader.bin"
              test -s "$V3_BUILD_DIR/partitions.bin"
              test -s "$V3_BUILD_DIR/firmware.bin"
              test -s "$BOOT_APP0"

              mkdir -p "$RECOVERY_DIR"
              cp "$V3_BUILD_DIR/bootloader.bin" "$RECOVERY_DIR/bootloader.bin"
              cp "$V3_BUILD_DIR/partitions.bin" "$RECOVERY_DIR/partitions.bin"
              cp "$BOOT_APP0" "$RECOVERY_DIR/boot_app0.bin"
              cp "$V3_BUILD_DIR/firmware.bin" "$RECOVERY_DIR/firmware.bin"

              cat > "$RECOVERY_DIR/FLASH_RECOVERY.txt" <<'EOF'
          HiveFW Heltec V3 USB recovery
          ==============================

          This recovery layout PRESERVES NVS at 0x9000, including HiveFW
          runtime Wi-Fi credentials. Do NOT erase flash first.

          Put the Heltec V3 in USB boot/download mode and run:

          python -m esptool --chip esp32s3 --port <PORT> --baud 921600 write_flash \
            0x0000 bootloader.bin \
            0x8000 partitions.bin \
            0xE000 boot_app0.bin \
            0x10000 firmware.bin

          If 921600 is unreliable, retry with --baud 460800.

          IMPORTANT:
          - Do not use erase_flash.
          - Do not write anything at 0x9000.
          - boot_app0.bin at 0xE000 resets the OTA selection metadata.
          EOF

              (
                cd "$RECOVERY_DIR"
                sha256sum bootloader.bin partitions.bin boot_app0.bin firmware.bin > SHA256SUMS.txt
                zip -9 "../$RECOVERY_ZIP" bootloader.bin partitions.bin boot_app0.bin firmware.bin FLASH_RECOVERY.txt SHA256SUMS.txt
              )
              ;;

            Heltec_v3_companion_radio_ble)
              V3_BLE_BIN="$(find out -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_ble-*.bin' ! -name '*-merged.bin' -print -quit)"
              V3_BLE_MERGED="$(find out -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_ble-*-merged.bin' -print -quit)"
              test -s "$V3_BLE_BIN"
              test -s "$V3_BLE_MERGED"
              cp "$V3_BLE_BIN" "$V3_BLE_MERGED" release-assets/
              ;;

            Heltec_t114_companion_radio_ble)
              T114_ZIP="$(find out -maxdepth 1 -type f -name 'Heltec_t114_companion_radio_ble-*.zip' -print -quit)"
              T114_UF2="$(find out -maxdepth 1 -type f -name 'Heltec_t114_companion_radio_ble-*.uf2' -print -quit)"
              test -s "$T114_ZIP"
              test -s "$T114_UF2"
              cp "$T114_ZIP" "$T114_UF2" release-assets/
              ;;
          esac

          (
            cd release-assets
            for file in *; do
              [[ "$file" == *.sha256 ]] && continue
              sha256sum "$file" > "$file.sha256"
            done
          )

      - name: Upload ${{ matrix.target }} assets
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release HiveFW ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve firmware version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${VERSION#V}"
          VERSION="${VERSION#v}"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download built firmware assets
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          path: release-assets
          merge-multiple: true

      - name: Validate device-specific release assets
        shell: bash
        run: |
          set -euo pipefail
          V3_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*.bin' ! -name '*-merged.bin' ! -name '*.sha256' | wc -l)"
          V3_MERGED_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*-merged.bin' ! -name '*.sha256' | wc -l)"
          V3_RECOVERY_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*-recovery.zip' ! -name '*.sha256' | wc -l)"
          V3_BLE_BIN_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_ble-*.bin' ! -name '*-merged.bin' ! -name '*.sha256' | wc -l)"
          V3_BLE_MERGED_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_ble-*-merged.bin' ! -name '*.sha256' | wc -l)"
          T114_ZIP_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_t114_companion_radio_ble-*.zip' ! -name '*.sha256' | wc -l)"
          T114_UF2_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_t114_companion_radio_ble-*.uf2' ! -name '*.sha256' | wc -l)"

          if [[ "$V3_COUNT" -lt 1 || "$V3_MERGED_COUNT" -lt 1 || "$V3_RECOVERY_COUNT" -lt 1 || "$V3_BLE_BIN_COUNT" -lt 1 || "$V3_BLE_MERGED_COUNT" -lt 1 || "$T114_ZIP_COUNT" -lt 1 || "$T114_UF2_COUNT" -lt 1 ]]; then
            echo "Release blocked: required V3 Wi-Fi, V3 BLE and T114 assets are missing."
            ls -lh release-assets
            exit 1
          fi

          ls -lh release-assets

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            CURRENT="$(git rev-list -n 1 "$TAG")"
            if [[ "$CURRENT" != "$GITHUB_SHA" ]]; then
              git tag -f "$TAG" "$GITHUB_SHA"
              git push --force origin "$TAG"
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HiveFW ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'test') }}
          generate_release_notes: true
          files: release-assets/*
