name: Build & Release HiveFW
# Unified release pipeline: Firmware + Home Assistant Integration + Android App.

concurrency:
  group: hivefw-release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - ".github/workflows/hivefw-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Heltec_v3_companion_radio_wifi
          - Heltec_v3_companion_radio_ble
          - Heltec_t114_companion_radio_ble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment

      - name: Resolve firmware version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${VERSION#V}"
          VERSION="${VERSION#v}"

          MANIFEST_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("custom_components/hivefw_integration/manifest.json").read_text())
          print(data["version"])
          PY
          )"

          if [[ "${VERSION}" != "${MANIFEST_VERSION}" ]]; then
            echo "Version mismatch: VERSION=${VERSION}, manifest=${MANIFEST_VERSION}"
            exit 1
          fi

          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.target }}
        env:
          FIRMWARE_VERSION: V${{ steps.version.outputs.version }}
        shell: bash
        run: ./build.sh build-firmware "${{ matrix.target }}"

      - name: Prepare target release assets
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          case "$TARGET" in
            Heltec_v3_companion_radio_wifi)
              V3_BIN="$(find out -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*.bin' ! -name '*-merged.bin' -print -quit)"
              V3_MERGED="$(find out -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*-merged.bin' -print -quit)"
              test -s "$V3_BIN"
              test -s "$V3_MERGED"
              cp "$V3_BIN" "$V3_MERGED" release-assets/

              V3_BUILD_DIR=".pio/build/Heltec_v3_companion_radio_wifi"
              BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
              RECOVERY_DIR="recovery-v3"
              RECOVERY_ZIP="release-assets/$(basename "$V3_BIN" .bin)-recovery.zip"

              test -s "$V3_BUILD_DIR/bootloader.bin"
              test -s "$V3_BUILD_DIR/partitions.bin"
              test -s "$V3_BUILD_DIR/firmware.bin"
              test -s "$BOOT_APP0"

              mkdir -p "$RECOVERY_DIR"
              cp "$V3_BUILD_DIR/bootloader.bin" "$RECOVERY_DIR/bootloader.bin"
              cp "$V3_BUILD_DIR/partitions.bin" "$RECOVERY_DIR/partitions.bin"
              cp "$BOOT_APP0" "$RECOVERY_DIR/boot_app0.bin"
              cp "$V3_BUILD_DIR/firmware.bin" "$RECOVERY_DIR/firmware.bin"

              cat > "$RECOVERY_DIR/FLASH_RECOVERY.txt" <<'EOF'
          HiveFW Heltec V3 USB recovery
          ==============================

          This recovery layout PRESERVES NVS at 0x9000, including HiveFW
          runtime Wi-Fi credentials. Do NOT erase flash first.

          Put the Heltec V3 in USB boot/download mode and run:

          python -m esptool --chip esp32s3 --port <PORT> --baud 921600 write_flash \
            0x0000 bootloader.bin \
            0x8000 partitions.bin \
            0xE000 boot_app0.bin \
            0x10000 firmware.bin

          If 921600 is unreliable, retry with --baud 460800.

          IMPORTANT:
          - Do not use erase_flash.
          - Do not write anything at 0x9000.
          - boot_app0.bin at 0xE000 resets the OTA selection metadata.
          EOF

              (
                cd "$RECOVERY_DIR"
                sha256sum bootloader.bin partitions.bin boot_app0.bin firmware.bin > SHA256SUMS.txt
                zip -9 "../$RECOVERY_ZIP" bootloader.bin partitions.bin boot_app0.bin firmware.bin FLASH_RECOVERY.txt SHA256SUMS.txt
              )
              ;;

            Heltec_v3_companion_radio_ble)
              V3_BLE_BIN="$(find out -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_ble-*.bin' ! -name '*-merged.bin' -print -quit)"
              V3_BLE_MERGED="$(find out -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_ble-*-merged.bin' -print -quit)"
              test -s "$V3_BLE_BIN"
              test -s "$V3_BLE_MERGED"
              cp "$V3_BLE_BIN" "$V3_BLE_MERGED" release-assets/
              ;;

            Heltec_t114_companion_radio_ble)
              T114_ZIP="$(find out -maxdepth 1 -type f -name 'Heltec_t114_companion_radio_ble-*.zip' -print -quit)"
              T114_UF2="$(find out -maxdepth 1 -type f -name 'Heltec_t114_companion_radio_ble-*.uf2' -print -quit)"
              test -s "$T114_ZIP"
              test -s "$T114_UF2"
              cp "$T114_ZIP" "$T114_UF2" release-assets/
              ;;
          esac

          (
            cd release-assets
            for file in *; do
              [[ "$file" == *.sha256 ]] && continue
              sha256sum "$file" > "$file.sha256"
            done
          )

      - name: Upload ${{ matrix.target }} assets
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  package-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${VERSION#V}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package Home Assistant integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ZIP="release-assets/HiveFW-Integration-${{ steps.version.outputs.version }}.zip"
          zip -r -9 "$ZIP" custom_components/hivefw_integration             -x '*/__pycache__/*' '*.pyc'
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Upload integration assets
        uses: actions/upload-artifact@v7
        with:
          name: integration
          path: release-assets/*
          if-no-files-found: error

  build-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle*
            app/android/**/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${VERSION#V}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure persistent Android signing
        if: env.HAS_SIGNING_KEY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        run: flutter build apk --release

      - name: Build preview APK fallback
        if: env.HAS_SIGNING_KEY != 'true'
        run: flutter build apk --debug

      - name: Prepare app release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/dist
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$HAS_SIGNING_KEY" == "true" ]]; then
            SRC="build/app/outputs/flutter-apk/app-release.apk"
            DEST="build/dist/HiveFW-App-${VERSION}.apk"
          else
            SRC="build/app/outputs/flutter-apk/app-debug.apk"
            DEST="build/dist/HiveFW-App-${VERSION}-preview.apk"
            printf '%s\n'               "This APK is an installable debug/preview build because persistent Android signing secrets were not available to the unified release workflow."               "Firmware and Home Assistant Integration assets in this release are unaffected."               > "build/dist/HiveFW-App-${VERSION}-preview.txt"
          fi
          test -s "$SRC"
          cp "$SRC" "$DEST"
          sha256sum "$DEST" > "$DEST.sha256"

      - name: Upload app assets
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            app/build/dist/*.apk
            app/build/dist/*.sha256
            app/build/dist/*.txt
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: rm -f android/key.properties android/app/keystore.jks

  publish:
    needs: [build, package-integration, build-app]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release HiveFW ')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve firmware version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${VERSION#V}"
          VERSION="${VERSION#v}"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download unified release assets
        uses: actions/download-artifact@v7
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Validate device-specific release assets
        shell: bash
        run: |
          set -euo pipefail
          V3_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*.bin' ! -name '*-merged.bin' ! -name '*.sha256' | wc -l)"
          V3_MERGED_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*-merged.bin' ! -name '*.sha256' | wc -l)"
          V3_RECOVERY_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_wifi-*-recovery.zip' ! -name '*.sha256' | wc -l)"
          V3_BLE_BIN_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_ble-*.bin' ! -name '*-merged.bin' ! -name '*.sha256' | wc -l)"
          V3_BLE_MERGED_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_v3_companion_radio_ble-*-merged.bin' ! -name '*.sha256' | wc -l)"
          T114_ZIP_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_t114_companion_radio_ble-*.zip' ! -name '*.sha256' | wc -l)"
          T114_UF2_COUNT="$(find release-assets -maxdepth 1 -type f -name 'Heltec_t114_companion_radio_ble-*.uf2' ! -name '*.sha256' | wc -l)"
          INTEGRATION_COUNT="$(find release-assets -maxdepth 1 -type f -name 'HiveFW-Integration-*.zip' ! -name '*.sha256' | wc -l)"
          APP_COUNT="$(find release-assets -maxdepth 1 -type f -name 'HiveFW-App-*.apk' ! -name '*.sha256' | wc -l)"

          if [[ "$V3_COUNT" -lt 1 || "$V3_MERGED_COUNT" -lt 1 || "$V3_RECOVERY_COUNT" -lt 1 || "$V3_BLE_BIN_COUNT" -lt 1 || "$V3_BLE_MERGED_COUNT" -lt 1 || "$T114_ZIP_COUNT" -lt 1 || "$T114_UF2_COUNT" -lt 1 || "$INTEGRATION_COUNT" -lt 1 || "$APP_COUNT" -lt 1 ]]; then
            echo "Release blocked: one or more unified Firmware / Integration / App assets are missing."
            ls -lh release-assets
            exit 1
          fi

          ls -lh release-assets

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            CURRENT="$(git rev-list -n 1 "$TAG")"
            if [[ "$CURRENT" != "$GITHUB_SHA" ]]; then
              git tag -f "$TAG" "$GITHUB_SHA"
              git push --force origin "$TAG"
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HiveFW ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'test') }}
          generate_release_notes: true
          files: release-assets/*

      - name: Remove older GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: v${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [[ -z "$tag" || "$tag" == "$CURRENT_TAG" ]] && continue
            echo "Deleting older release: $tag"
            gh release delete "$tag" --yes
          done
