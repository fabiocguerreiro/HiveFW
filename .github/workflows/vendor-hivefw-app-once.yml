name: Vendor HiveFW app once

on:
  push:
    paths:
      - ".github/HIVEFW_APP_MIGRATION_TRIGGER"

permissions:
  contents: write

jobs:
  vendor-app:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HiveFW
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout HiveFW app snapshot
        uses: actions/checkout@v4
        with:
          repository: fabiocguerreiro/HiveFW-app
          ref: f83f3f34aa1616d2f4e67f11aa7ce5d5f2322746
          path: _hivefw_app_source

      - name: Vendor app into monorepo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app
          rsync -a --delete --exclude='.git/' _hivefw_app_source/ app/
          rm -rf _hivefw_app_source
          cat > app/MIGRATION_SOURCE.md <<'EOF'
          # HiveFW App migration source

          The application was vendored into the unified HiveFW repository from:

          - Repository: `fabiocguerreiro/HiveFW-app`
          - Commit: `f83f3f34aa1616d2f4e67f11aa7ce5d5f2322746`
          - Previous app release baseline: `0.3.0 beta 1`

          The former repository remains available as migration history/rollback.
          New development continues under `app/` in `fabiocguerreiro/HiveFW`.
          EOF

      - name: Commit vendored app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "App snapshot already present."
            exit 0
          fi
          git commit -m "Vendor HiveFW app into unified repository"
          git pull --rebase origin main
          git push origin HEAD:main
