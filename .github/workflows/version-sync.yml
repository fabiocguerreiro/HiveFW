name: Version sync

on:
  # On main, validate only once the canonical VERSION file changes. Release
  # preparation updates manifest.json first and VERSION second, so triggering
  # on both files creates a guaranteed transient mismatch and noisy failure
  # notifications for the intermediate commit.
  push:
    branches: [main]
    paths:
      - "VERSION"
      - ".github/workflows/version-sync.yml"
  pull_request:
    paths:
      - "VERSION"
      - "custom_components/hivefw_integration/manifest.json"
      - ".github/workflows/version-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify shared HiveFW version
        shell: bash
        run: |
          set -euo pipefail
          FW_VERSION="$(tr -d '[:space:]' < VERSION)"
          FW_VERSION="${FW_VERSION#V}"
          FW_VERSION="${FW_VERSION#v}"

          HA_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("custom_components/hivefw_integration/manifest.json").read_text())
          print(data["version"])
          PY
          )"

          echo "Firmware:         $FW_VERSION"
          echo "Home Assistant:   $HA_VERSION"

          if [[ "$FW_VERSION" != "$HA_VERSION" ]]; then
            echo "::error::VERSION and manifest.json are not synchronized"
            exit 1
          fi
