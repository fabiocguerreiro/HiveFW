site_name: HiveFW Docs
site_url: https://github.com/fabiocguerreiro/HiveFW
site_description: Documentation for HiveFW firmware and Home Assistant integration

repo_name: fabiocguerreiro/HiveFW
repo_url: https://github.com/fabiocguerreiro/HiveFW
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - search.highlight
    - search.suggest

extra_css:
  - _stylesheets/extra.css

nav:
  - Home: index.md
  - Supported hardware: supported_hardware.md
  - Wi-Fi provisioning: hivefw_wifi_provisioning.md
  - Repository migration: repository_migration.md
  - MeshCore protocol:
      - Companion protocol: companion_protocol.md
      - Packet format: packet_format.md
      - Payloads: payloads.md
      - Binary stats: stats_binary_frames.md
      - Number allocations: number_allocations.md
      - QR codes: qr_codes.md
      - CLI commands: cli_commands.md
  - nRF52 power management: nrf52_power_management.md
  - FAQ: faq.md
  - Local docs: docs.md
